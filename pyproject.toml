[project]
name = "cwe-classifier"
version = "0.1.0"
description = "Suggest CWEs for vulnerability descriptions with reproducible hierarchy experiments and OpenAI Decisions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.26.0,<4",
]

[project.optional-dependencies]
jev = ["typesafe-sdk==0.7.4"]
notebook = [
    "chromadb>=1.0.13",
    "jupyterlab==4.6.4",
    "matplotlib==3.11.2",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "pandas==3.0.6",
]
