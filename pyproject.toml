[project]
name = "cwe-classifier"
version = "0.1.0"
description = "A semantic search tool for Common Weakness Enumeration (CWE) database using ChromaDB vector embeddings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.0.13",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab==4.6.4",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
]
jev = [
    "typesafe-sdk==0.7.4",
]
